<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysioPlaner – Hausaufgaben-Generator</title>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
  <style>
    :root {
      --primary: #1a6fb5;
      --primary-dark: #145a96;
      --primary-light: #e8f0fb;
      --accent: #00a896;
      --danger: #e53e3e;
      --text: #2d3748;
      --text-light: #718096;
      --border: #e2e8f0;
      --bg: #f7f9fc;
      --white: #ffffff;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

    #settingsBtn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    #settingsBtn:hover { background: rgba(255,255,255,0.28); }

    /* ── Tabs ── */
    .tabs {
      background: var(--white);
      border-bottom: 2px solid var(--border);
      padding: 0 2rem;
      display: flex;
    }
    .tab-btn {
      padding: 0.85rem 1.4rem;
      border: none;
      background: none;
      color: var(--text-light);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── Main ── */
    main {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Card ── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .card h2 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 1.1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Form ── */
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.62rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.93rem;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.2s, background 0.2s;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--white);
    }
    .form-group textarea { min-height: 76px; resize: vertical; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.68rem 1.3rem;
      border: none;
      border-radius: 6px;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-success { background: var(--accent); color: white; }
    .btn-success:hover { background: #00897a; }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #c53030; }

    /* ── Output ── */
    #output-container { margin-top: 1.5rem; }
    #output {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      min-height: 160px;
      line-height: 1.85;
    }
    #output h3 {
      color: var(--primary);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 1.2rem 0 0.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    #output h3:first-child { margin-top: 0; }
    #output p  { margin-bottom: 0.4rem; }
    #output strong { color: var(--text); }
    .export-bar { display: flex; gap: 0.8rem; margin-top: 1rem; flex-wrap: wrap; }

    /* ── Brain Table ── */
    .brain-header {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    .brain-header input {
      flex: 1;
      padding: 0.62rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.93rem;
      background: var(--white);
      font-family: inherit;
    }
    .brain-header input:focus { outline: none; border-color: var(--primary); }

    .table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; background: var(--white); }
    thead { background: var(--primary); color: white; }
    thead th { padding: 0.85rem 1rem; text-align: left; font-size: 0.83rem; font-weight: 600; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--primary-light); }
    tbody td { padding: 0.75rem 1rem; font-size: 0.88rem; vertical-align: top; }
    .desc-cell { max-width: 320px; color: var(--text-light); font-size: 0.83rem; white-space: pre-wrap; word-break: break-word; }
    .actions { white-space: nowrap; }

    .btn-small {
      padding: 0.28rem 0.65rem;
      font-size: 0.78rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.3rem;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .btn-small:hover { opacity: 0.75; }
    .btn-edit   { background: var(--primary-light); color: var(--primary); }
    .btn-delete { background: #fff5f5; color: var(--danger); }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-wu { background: #fef3c7; color: #92400e; }
    .badge-lo { background: #d1fae5; color: #065f46; }
    .badge-kr { background: #dbeafe; color: #1e40af; }

    /* ── Modal ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.48);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.8rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h2 {
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 1.1rem;
    }
    .modal-content label {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      margin-top: 0.85rem;
    }
    .modal-content label:first-of-type { margin-top: 0; }
    .modal-content input,
    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 0.62rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.93rem;
      background: var(--bg);
      font-family: inherit;
    }
    .modal-content input:focus,
    .modal-content select:focus,
    .modal-content textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--white);
    }
    .modal-content textarea { min-height: 110px; resize: vertical; }
    .modal-footer {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.4rem;
      justify-content: flex-end;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 0.35rem;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 1.8rem;
      right: 1.8rem;
      padding: 0.75rem 1.1rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.28s;
      z-index: 2000;
      box-shadow: var(--shadow);
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-ok  { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    .toast-err { background: #fff5f5; color: #9b2c2c; border: 1px solid #fed7d7; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .empty { text-align: center; color: var(--text-light); padding: 2.5rem 1rem; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 0.9rem 1rem; }
      .tabs  { padding: 0 0.5rem; }
      .tab-btn { padding: 0.75rem 0.9rem; font-size: 0.88rem; }
      main { margin: 1rem auto; padding: 0 0.75rem; }
      .brain-header { flex-direction: column; }
      .desc-cell { display: none; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════ HEADER ══════════════════════════════════ -->
<header>
  <div>
    <h1>PhysioPlaner</h1>
    <p>Hausaufgaben-Generator für die Physiotherapie</p>
  </div>
  <button id="settingsBtn" title="Einstellungen">⚙</button>
</header>

<!-- ══════════════════════════════════ TABS ══════════════════════════════════ -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="plan">Plan erstellen</button>
  <button class="tab-btn" data-tab="brain">Übungsdatenbank</button>
</nav>

<!-- ══════════════════════════════════ MAIN ══════════════════════════════════ -->
<main>

  <!-- ─── Tab: Plan erstellen ─── -->
  <div id="tab-plan" class="tab-content active">
    <div class="card">
      <h2>Patientendaten &amp; Übungen</h2>

      <div class="form-group">
        <label for="pat_info">Patient (Name, Alter)</label>
        <input id="pat_info" type="text" placeholder="z.B. Maria M., 45 Jahre">
      </div>

      <div class="form-group">
        <label for="goal_info">Diagnose / Ziel</label>
        <input id="goal_info" type="text" placeholder="z.B. LWS-Syndrom, Schulterinstabilität nach OP">
      </div>

      <div class="form-group">
        <label for="exercise_input">Gewünschte Übungen (kommagetrennt)</label>
        <input id="exercise_input" type="text" placeholder="z.B. Brücke, Plank, Schulterkreisen, Kniebeuge">
      </div>

      <button id="generateBtn" class="btn btn-primary" onclick="generatePlan()">
        Plan generieren
      </button>
    </div>

    <div id="output-container" style="display:none">
      <div class="card">
        <h2>Generierter Plan</h2>
        <div id="output"></div>
        <div class="export-bar">
          <button class="btn btn-success" onclick="exportWord()">&#8595; Als Word exportieren (.docx)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Tab: Übungsdatenbank ─── -->
  <div id="tab-brain" class="tab-content">
    <div class="brain-header">
      <input id="brain-search" type="text" placeholder="Übungen suchen..." oninput="renderBrainTable()">
      <button class="btn btn-primary" onclick="openExerciseModal()">+ Neue Übung</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Kategorie</th>
            <th class="desc-cell">Beschreibung</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody id="brain-tbody"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- ══════════════════════════════════ SETTINGS MODAL ══════════════════════════ -->
<div id="settings-modal" class="modal">
  <div class="modal-content">
    <h2>⚙ Einstellungen</h2>
    <label for="api-key-input">Gemini API Key</label>
    <input id="api-key-input" type="password" placeholder="AIzaSy...">
    <p class="hint">Der Key wird ausschließlich lokal in diesem Browser gespeichert und nirgends übertragen.</p>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('settings-modal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveApiKey()">Speichern</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════ EXERCISE MODAL ══════════════════════════ -->
<div id="exercise-modal" class="modal">
  <div class="modal-content">
    <h2 id="ex-modal-title">Neue Übung</h2>
    <input id="ex-id" type="hidden">

    <label for="ex-name">Name *</label>
    <input id="ex-name" type="text" placeholder="z.B. Brücke (Gluteal Bridge)">

    <label for="ex-cat">Kategorie *</label>
    <select id="ex-cat">
      <option value="Warm-up">Warm-up</option>
      <option value="Lockerung">Lockerung</option>
      <option value="Kräftigung">Kräftigung</option>
    </select>

    <label for="ex-desc">Beschreibung / Ausführung *</label>
    <textarea id="ex-desc" placeholder="Ausgangsstellung, Bewegungsablauf, Wiederholungen / Dauer ..."></textarea>

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('exercise-modal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveExercise()">Speichern</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════ SCRIPT ══════════════════════════════════ -->
<script>
'use strict';

// ─────────────── Brain (localStorage) ───────────────
function loadBrain() {
  try { return JSON.parse(localStorage.getItem('physio_brain') || '[]'); }
  catch { return []; }
}
function saveBrain(brain) {
  localStorage.setItem('physio_brain', JSON.stringify(brain));
}

// ─────────────── API Key ───────────────
function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) { showToast('Bitte einen API Key eingeben.', 'err'); return; }
  localStorage.setItem('physio_api_key', key);
  closeModal('settings-modal');
  showToast('API Key gespeichert.');
}

// ─────────────── Tabs ───────────────
function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  if (tab === 'brain') renderBrainTable();
}

// ─────────────── Generate Plan ───────────────
let lastGeneratedText = '';

async function generatePlan() {
  const apiKey = localStorage.getItem('physio_api_key');
  if (!apiKey) {
    showToast('Bitte zuerst den Gemini API Key in den Einstellungen eintragen.', 'err');
    openModal('settings-modal');
    return;
  }

  // Sanitize inputs to prevent prompt injection
  const sanitize = s => String(s).replace(/[`\\]/g, '').substring(0, 500).trim();
  const patInfo   = sanitize(document.getElementById('pat_info').value);
  const goalInfo  = sanitize(document.getElementById('goal_info').value);
  const exercises = sanitize(document.getElementById('exercise_input').value);

  if (!patInfo || !goalInfo || !exercises) {
    showToast('Bitte alle drei Felder ausfüllen.', 'err');
    return;
  }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> KI analysiert...';
  document.getElementById('output-container').style.display = 'none';

  const brain = loadBrain();
  const brainText = brain.length > 0
    ? brain.map(ex => `Eintrag: ${ex.name}\nKategorie: ${ex.cat}\nBeschreibung: ${ex.desc}`).join('\n---\n')
    : '(Datenbank ist noch leer – bitte nutze ausschließlich dein Fachwissen und markiere alle Übungen mit *)';

  const prompt =
`Du bist ein erfahrener Physiotherapeut und erstellst Hausaufgabenpläne für Patienten.

DATENBANK-LOGIK:
Dir liegt eine Übungsdatenbank vor. Übungen können mehrere Namen haben (Deutsch/Englisch, Synonyme).
Wenn der Therapeut einen Namen eingibt, prüfe ob er im Namen oder in der Beschreibung vorkommt oder semantisch identisch ist (z.B. "Plank" = "Unterarmstütz" = "Planke").

DEINE DATENBANK:
${brainText}

AUFTRAG:
Erstelle einen Hausaufgabenplan für:
Patient: ${patInfo}
Diagnose / Ziel: ${goalInfo}
Gewünschte Übungen: ${exercises}

STRENGE FORMATIERUNGS-REGELN – halte dich exakt daran:
- Sortiere alle Übungen in genau drei Abschnitte: Warm-up, Lockerung, Kräftigung
- Beginne jeden Abschnitt mit der Zeile: ## WARM-UP  oder  ## LOCKERUNG  oder  ## KRÄFTIGUNG
- Pro Übung: Zeile 1 = **Übungsname**, dann Beschreibung, dann Wiederholungen/Dauer
- Nutze die Beschreibungen aus der Datenbank, passe sie ggf. auf den Patienten an
- Übungen ohne Datenbankeinträge mit * markieren
- Schreibe professionell, klar und patientenfreundlich auf Deutsch`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err.error?.message || `HTTP ${res.status}`;
      throw new Error(msg);
    }

    const data = await res.json();
    lastGeneratedText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!lastGeneratedText) throw new Error('Leere Antwort von der KI.');

    renderOutput(lastGeneratedText);
    document.getElementById('output-container').style.display = 'block';
    document.getElementById('output-container').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    let msg = e.message || 'Unbekannter Fehler';
    if (msg.includes('API_KEY_INVALID') || msg.includes('400')) msg = 'Ungültiger API Key. Bitte in den Einstellungen prüfen.';
    if (msg.includes('429')) msg = 'Rate Limit erreicht. Bitte kurz warten und erneut versuchen.';
    showToast('Fehler: ' + msg, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Plan generieren';
  }
}

// ─────────────── Render output ───────────────
function renderOutput(text) {
  const lines = text.split('\n');
  let html = '';

  for (const line of lines) {
    const trimmed = line.trim();
    if (/^##\s+/i.test(trimmed)) {
      html += `<h3>${esc(trimmed.replace(/^##\s+/, ''))}</h3>`;
    } else if (/^\*\*(.+?)\*\*/.test(trimmed)) {
      html += `<p><strong>${esc(trimmed.replace(/\*\*(.+?)\*\*/g, '$1'))}</strong></p>`;
    } else if (trimmed === '') {
      html += '<br>';
    } else {
      html += `<p>${esc(trimmed)}</p>`;
    }
  }

  document.getElementById('output').innerHTML = html;
}

// ─────────────── Word Export ───────────────
async function exportWord() {
  if (!lastGeneratedText) return;
  if (typeof docx === 'undefined') {
    showToast('Word-Export nicht verfügbar. Bitte Internetverbindung prüfen.', 'err');
    return;
  }

  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;

  const patInfo = document.getElementById('pat_info').value.trim();
  const today   = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const children = [
    new Paragraph({
      children: [new TextRun({ text: 'Hausaufgabenplan – Physiotherapie', bold: true, size: 32 })],
      heading: HeadingLevel.HEADING_1,
      spacing: { after: 80 }
    }),
    new Paragraph({
      children: [new TextRun({ text: `Patient: ${patInfo}`, size: 22 })],
      spacing: { after: 40 }
    }),
    new Paragraph({
      children: [new TextRun({ text: `Erstellt am: ${today}`, size: 22, color: '718096' })],
      spacing: { after: 300 }
    })
  ];

  const lines = lastGeneratedText.split('\n');
  for (const line of lines) {
    const trimmed = line.trim();
    if (/^##\s+/i.test(trimmed)) {
      children.push(new Paragraph({
        children: [new TextRun({ text: trimmed.replace(/^##\s+/, ''), bold: true, size: 26, color: '1a6fb5' })],
        heading: HeadingLevel.HEADING_2,
        spacing: { before: 300, after: 120 }
      }));
    } else if (/^\*\*(.+?)\*\*/.test(trimmed)) {
      const name = trimmed.replace(/\*\*(.+?)\*\*/g, '$1');
      children.push(new Paragraph({
        children: [new TextRun({ text: name, bold: true, size: 22 })],
        spacing: { before: 160, after: 60 }
      }));
    } else if (trimmed !== '') {
      children.push(new Paragraph({
        children: [new TextRun({ text: trimmed, size: 20 })],
        spacing: { after: 60 }
      }));
    } else {
      children.push(new Paragraph({ children: [new TextRun('')], spacing: { after: 80 } }));
    }
  }

  try {
    const doc  = new Document({ sections: [{ properties: {}, children }] });
    const blob = await Packer.toBlob(doc);
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `Hausaufgaben_${patInfo.replace(/\s+/g, '_')}_${today.replace(/\./g, '-')}.docx`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Word-Dokument wird heruntergeladen.');
  } catch (e) {
    showToast('Export fehlgeschlagen: ' + e.message, 'err');
  }
}

// ─────────────── Brain Table ───────────────
function badgeClass(cat) {
  if (cat === 'Warm-up')    return 'badge-wu';
  if (cat === 'Lockerung')  return 'badge-lo';
  if (cat === 'Kräftigung') return 'badge-kr';
  return 'badge-wu';
}

function renderBrainTable() {
  const brain  = loadBrain();
  const search = (document.getElementById('brain-search')?.value || '').toLowerCase();
  const list   = search
    ? brain.filter(ex => ex.name.toLowerCase().includes(search) || ex.cat.toLowerCase().includes(search) || ex.desc.toLowerCase().includes(search))
    : brain;

  const tbody = document.getElementById('brain-tbody');
  if (list.length === 0) {
    const msg = brain.length === 0
      ? 'Noch keine Übungen eingetragen. Klicke auf „+ Neue Übung" um zu beginnen.'
      : 'Keine Übungen gefunden.';
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty"><div class="empty-icon">📋</div>${esc(msg)}</div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(ex => `
    <tr>
      <td>${esc(ex.name)}</td>
      <td><span class="badge ${badgeClass(ex.cat)}">${esc(ex.cat)}</span></td>
      <td class="desc-cell">${esc(ex.desc)}</td>
      <td class="actions">
        <button class="btn-small btn-edit"   onclick="editExercise('${esc(ex.id)}')">Bearbeiten</button>
        <button class="btn-small btn-delete" onclick="deleteExercise('${esc(ex.id)}')">Löschen</button>
      </td>
    </tr>`).join('');
}

// ─────────────── Exercise CRUD ───────────────
function openExerciseModal(id = null) {
  document.getElementById('ex-modal-title').textContent = id ? 'Übung bearbeiten' : 'Neue Übung';
  document.getElementById('ex-id').value   = id || '';
  document.getElementById('ex-name').value = '';
  document.getElementById('ex-cat').value  = 'Warm-up';
  document.getElementById('ex-desc').value = '';

  if (id) {
    const ex = loadBrain().find(e => e.id === id);
    if (ex) {
      document.getElementById('ex-name').value = ex.name;
      document.getElementById('ex-cat').value  = ex.cat;
      document.getElementById('ex-desc').value = ex.desc;
    }
  }
  openModal('exercise-modal');
}

function editExercise(id) { openExerciseModal(id); }

function saveExercise() {
  const name = document.getElementById('ex-name').value.trim();
  const cat  = document.getElementById('ex-cat').value;
  const desc = document.getElementById('ex-desc').value.trim();
  const id   = document.getElementById('ex-id').value;

  if (!name || !desc) { showToast('Name und Beschreibung sind Pflichtfelder.', 'err'); return; }

  const brain = loadBrain();
  if (id) {
    const idx = brain.findIndex(e => e.id === id);
    if (idx !== -1) brain[idx] = { ...brain[idx], name, cat, desc };
  } else {
    brain.push({ id: crypto.randomUUID(), name, cat, desc });
  }

  saveBrain(brain);
  closeModal('exercise-modal');
  renderBrainTable();
  showToast(id ? 'Übung aktualisiert.' : 'Übung hinzugefügt.');
}

function deleteExercise(id) {
  if (!confirm('Diese Übung wirklich löschen?')) return;
  saveBrain(loadBrain().filter(e => e.id !== id));
  renderBrainTable();
  showToast('Übung gelöscht.');
}

// ─────────────── Modals ───────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ─────────────── Toast ───────────────
function showToast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add('show')); });
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); }, 3500);
}

// ─────────────── HTML escape ───────────────
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─────────────── Init ───────────────
document.addEventListener('DOMContentLoaded', () => {
  const storedKey = localStorage.getItem('physio_api_key');
  if (storedKey) document.getElementById('api-key-input').value = storedKey;

  document.getElementById('settingsBtn').addEventListener('click', () => openModal('settings-modal'));

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => showTab(btn.dataset.tab));
  });

  document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(modal.id); });
  });
});
</script>
